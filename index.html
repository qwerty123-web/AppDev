<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minimal Expense Tracker</title>
  <style>
    :root {
      font-family: Arial, sans-serif;
      color: #222;
      background: #f5f7fb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .tracker {
      width: min(520px, 100%);
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 18px 50px rgba(33, 45, 77, 0.08);
      padding: 28px;
    }

    .tracker h1 {
      margin: 0 0 18px;
      font-size: 1.4rem;
      letter-spacing: -0.02em;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 22px;
    }

    .summary .card {
      padding: 16px;
      border-radius: 14px;
      background: #f7f9ff;
      text-align: center;
    }

    .summary .card span {
      display: block;
      margin-top: 8px;
      color: #5f6d8a;
      font-size: 0.9rem;
    }

    .form {
      display: grid;
      gap: 14px;
      margin-bottom: 22px;
    }

    .form input,
    .form button {
      width: 100%;
      border: 1px solid #dde2ee;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 0.95rem;
    }

    .form input:focus,
    .form button:focus {
      outline: 2px solid #7c8cff;
      outline-offset: 2px;
    }

    .form button {
      border: none;
      background: #4b6cff;
      color: white;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .form button:hover {
      background: #3a55d8;
    }

    .list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 12px;
    }

    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      border-radius: 14px;
      background: #fbfbff;
      border: 1px solid #eef1fb;
    }

    .item span {
      display: block;
    }

    .item .meta {
      color: #5f6d8a;
      font-size: 0.88rem;
    }

    .item .amount {
      font-weight: 700;
      color: #222;
    }

    .item button {
      margin-left: 14px;
      border: none;
      background: transparent;
      color: #d9534f;
      cursor: pointer;
      font-size: 1rem;
    }

    .empty {
      color: #7a83a3;
      text-align: center;
      padding: 26px;
      border-radius: 14px;
      background: #f7f8ff;
      border: 1px dashed #d7dbef;
    }
  </style>
</head>
<body>
  <main class="tracker">
    <h1>Expense Tracker</h1>

    <div class="summary">
      <div class="card">
        <strong id="balance">$0.00</strong>
        <span>Balance</span>
      </div>
      <div class="card">
        <strong id="income">$0.00</strong>
        <span>Income</span>
      </div>
      <div class="card">
        <strong id="expense">$0.00</strong>
        <span>Expense</span>
      </div>
    </div>

    <form id="expense-form" class="form">
      <input id="title" type="text" placeholder="Description" autocomplete="off" required />
      <input id="amount" type="number" step="0.01" placeholder="Amount" required />
      <button type="submit">Add Expense</button>
    </form>

    <ul id="transactions" class="list">
      <li class="empty">No expenses yet. Add one above.</li>
    </ul>
  </main>

  <script>
    const form = document.getElementById('expense-form');
    const titleInput = document.getElementById('title');
    const amountInput = document.getElementById('amount');
    const transactionsEl = document.getElementById('transactions');
    const balanceEl = document.getElementById('balance');
    const incomeEl = document.getElementById('income');
    const expenseEl = document.getElementById('expense');

    let transactions = [];

    function formatCurrency(value) {
      return new Intl.NumberFormat('en-US', {
        style: 'currency',
        currency: 'USD',
      }).format(value);
    }

    function updateSummary() {
      const amounts = transactions.map(txn => txn.amount);
      const income = amounts.filter(n => n > 0).reduce((sum, n) => sum + n, 0);
      const expense = amounts.filter(n => n < 0).reduce((sum, n) => sum + n, 0) * -1;
      const balance = income - expense;

      balanceEl.textContent = formatCurrency(balance);
      incomeEl.textContent = formatCurrency(income);
      expenseEl.textContent = formatCurrency(expense);
    }

    function renderTransactions() {
      transactionsEl.innerHTML = '';

      if (transactions.length === 0) {
        transactionsEl.innerHTML = '<li class="empty">No expenses yet. Add one above.</li>';
        return;
      }

      transactions.forEach(txn => {
        const item = document.createElement('li');
        item.className = 'item';

        item.innerHTML = `
          <div>
            <strong>${txn.title}</strong>
            <span class="meta">${txn.date}</span>
          </div>
          <div>
            <span class="amount">${formatCurrency(txn.amount)}</span>
            <button aria-label="Remove ${txn.title}" data-id="${txn.id}">×</button>
          </div>
        `;

        transactionsEl.appendChild(item);
      });
    }

    function addTransaction(title, amount) {
      const transaction = {
        id: Date.now().toString(),
        title,
        amount: Number(amount),
        date: new Date().toLocaleDateString(),
      };

      transactions.unshift(transaction);
      renderTransactions();
      updateSummary();
    }

    function removeTransaction(id) {
      transactions = transactions.filter(txn => txn.id !== id);
      renderTransactions();
      updateSummary();
    }

    form.addEventListener('submit', event => {
      event.preventDefault();
      const title = titleInput.value.trim();
      const amount = parseFloat(amountInput.value);

      if (!title || Number.isNaN(amount) || amount === 0) {
        return;
      }

      addTransaction(title, amount);
      titleInput.value = '';
      amountInput.value = '';
      titleInput.focus();
    });

    transactionsEl.addEventListener('click', event => {
      const button = event.target.closest('button');
      if (!button) return;
      const id = button.dataset.id;
      if (id) removeTransaction(id);
    });
  </script>
</body>
</html>
